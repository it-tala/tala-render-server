<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tala Render</title>
<style>
@font-face{font-family:"Inter";src:url(/static/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"BMono";src:url(/static/mono.woff2) format("woff2");font-display:swap}
:root{
  /* palet tema default Blender 5 */
  --view:#3d3d3d;          /* latar viewport 3D */
  --grid:rgba(0,0,0,.16); --grid-major:rgba(0,0,0,.28);
  --axis-x:rgba(255,51,82,.32); --axis-y:rgba(139,220,0,.26);
  --bg:#3d3d3d; --topbar:#232323; --header:#303030;
  --surface:#2b2b2b; --head:#303030; --raised:#545454; --raised-hi:#656565; --field:#1d1d1d;
  --line:#232323; --line-2:#3d3d3d; --outline:#1a1a1a;
  --ink:#e6e6e6; --ink-2:#c3c3c3; --muted:#9a9a9a;
  --orange:#ffa028; --orange-hi:#ffb54d; --orange-soft:rgba(255,160,40,.15);
  --blue:#4772b3; --blue-hi:#5680c2; --blue-dark:#334d80; --blue-soft:rgba(71,114,179,.22);
  --ok:#7fbf5a; --ok-soft:rgba(127,191,90,.15);
  --bad:#ff5a5a; --bad-soft:rgba(255,90,90,.14);
  --r:6px; --r-sm:4px;
  --font:Inter,"Segoe UI",-apple-system,Arial,sans-serif;
  --mono:BMono,Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--view)}
body{margin:0;color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;
  /* grid viewport ala Blender: garis halus tiap 24px, garis besar tiap 120px, sumbu X merah & Y hijau */
  background:
    linear-gradient(var(--axis-x),var(--axis-x)) 0 calc(58vh) / 100% 1.5px no-repeat,
    linear-gradient(var(--axis-y),var(--axis-y)) calc(64vw) 0 / 1.5px 100% no-repeat,
    linear-gradient(var(--grid-major) 1px,transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px) 0 0 / 120px 120px,
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0 / 24px 24px,
    radial-gradient(ellipse at 50% 30%,#444 0%,var(--view) 60%,#363636 100%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:22px;padding:0 22px;
  background:var(--topbar);border-bottom:1px solid #161616}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:inherit}
.mark{width:24px;height:24px;border-radius:6px;background:var(--orange);display:grid;place-items:center;color:#1d1d1d;font-weight:800;font-size:13px}
.brand b{font-size:14px;letter-spacing:.05em}
.tabs{display:flex;gap:2px;height:100%}
.tabs{align-items:center}
.tabs a{display:flex;align-items:center;height:28px;padding:0 12px;border-radius:5px;color:var(--ink-2);text-decoration:none;font-weight:500}
.tabs a:hover{color:var(--ink);background:#2f2f2f}
.tabs a.on{color:#fff;background:var(--raised)}
.top .grow{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.led.busy{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);animation:pulse 1.6s ease-in-out infinite}
.led.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
@keyframes pulse{50%{opacity:.45}}
.me{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-sm);
  border:1px solid var(--outline);background:var(--raised);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;
  font-weight:500;transition:background .12s,border-color .12s,filter .12s}
.btn:hover{background:var(--raised-hi)}
.btn:focus-visible,.tabs a:focus-visible,.seg button:focus-visible,.chip:focus-visible,.cam:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--orange);border-color:#c97a17;color:#1d1d1d;font-weight:600}
.btn.primary:hover{background:var(--orange-hi);border-color:var(--orange-hi)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--raised);color:var(--ink)}
.btn.danger{color:#f08a80}
.btn.lg{height:42px;font-size:15px;padding:0 18px}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}

main{max-width:1320px;margin:0 auto;padding:26px 22px 60px}
h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}

/* ---------- panels (gaya panel Blender) ---------- */
.panel{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--head);
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pb{padding:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.b-run{background:var(--orange-soft);color:var(--orange-hi)}
.b-q{background:var(--raised);color:var(--ink-2)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-mute{background:var(--raised);color:var(--muted)}

/* progress */
.bar{position:relative;height:8px;background:var(--field);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px #151515}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px;transition:width .6s ease}
.bar.thin{height:4px}
.bar.orange>i{background:var(--orange)}
.bar.indet>i{width:35%;animation:indet 1.3s ease-in-out infinite}
@keyframes indet{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.bar.indet>i{animation:none;width:100%;opacity:.4}.led.busy{animation:none}}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:20px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.now{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.shot{position:relative;background:#1d1d1d;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .ph-txt{color:#5a5a5a;font-size:12.5px;text-align:center;padding:12px}
.shot .tag{position:absolute;left:10px;top:10px;background:rgba(20,20,20,.8);color:var(--ink-2);font-size:11.5px;padding:3px 8px;border-radius:4px}
.now .info{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.title{font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:13px}
.meta span{white-space:nowrap}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);margin-top:7px}
.prow b{color:var(--ink);font-weight:600}
.big-pct{font-size:26px;font-weight:600;letter-spacing:-.02em}
.eta{font-size:13px;color:var(--ink-2)}
.eta b{color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.empty{padding:34px 20px;text-align:center}
.empty b{display:block;font-size:16px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;text-align:left;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:#353535}
tr.mine td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
.jn{font-weight:600}
.js{font-size:12px;color:var(--muted)}
.r{text-align:right}
.stat{display:flex;flex-direction:column;gap:12px}
.srow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.srow .k{color:var(--muted)}
.srow .v{font-variant-numeric:tabular-nums}
.recent a{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.recent a:last-child{border-bottom:0}
.recent a:hover{background:#353535}
.recent .th{aspect-ratio:16/10;background:#1d1d1d;border-radius:4px;overflow:hidden}
.recent .th img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- new render ---------- */
.steps{display:flex;gap:26px;margin:16px 0 22px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{display:flex;gap:8px;align-items:center}
.steps i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px}
.steps .done{color:var(--ink-2)}.steps .done i{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.steps .cur{color:var(--ink)}.steps .cur i{background:var(--orange);border-color:var(--orange);color:#1a1a1a;font-weight:700}
.drop{border:1.5px dashed #5a5a5a;border-radius:var(--r);padding:60px 24px;text-align:center;cursor:pointer;background:rgba(43,43,43,.92);transition:all .15s;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.drop:hover,.drop.over{border-color:var(--orange);background:var(--orange-soft)}
.drop b{display:block;font-size:17px;margin-bottom:6px}
.drop .hint{color:var(--muted);font-size:13px;max-width:560px;margin:14px auto 0}
.up{padding:26px 24px}
.up .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.up .fname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .pct{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.up .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.up .facts b{color:var(--ink);font-weight:600}
.phase{display:flex;flex-direction:column;gap:10px;margin-top:22px;font-size:13px}
.phase div{display:flex;gap:10px;align-items:center;color:var(--muted)}
.phase .ic{width:18px;text-align:center}
.phase .doneP{color:var(--ink-2)}.phase .doneP .ic{color:var(--ok)}
.phase .curP{color:var(--ink)}
.errbox{background:var(--bad-soft);color:#f3a49d;border-radius:var(--r-sm);padding:12px 14px;font-size:13px}
.warnbox{background:var(--orange-soft);color:#f6b874;border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.okline{color:var(--ok);font-size:12.5px}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px;font-size:13px}
.guide ol{margin:8px 0 0;padding-left:18px;color:var(--ink-2);line-height:1.7}
@media (max-width:760px){.guide{grid-template-columns:1fr}}

.cfg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.file{display:flex;align-items:center;gap:14px;padding:14px}
.file .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--raised);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--orange-hi)}
.file .g{flex:1;min-width:0}
.file .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{padding:16px 16px 18px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h .t{font-weight:600}
.sec-h .from{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--outline);border-radius:6px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:4px;cursor:pointer;color:var(--ink-2);text-align:left;min-width:150px}
.seg button small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button[aria-pressed="true"] small{color:#dbe6f6}
.camtools{display:flex;gap:6px;margin-left:auto}
.cams{display:flex;flex-direction:column;border:1px solid var(--outline);border-radius:6px;overflow:hidden;background:#282828}
.cam{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #232323;cursor:pointer}
.cam:last-child{border-bottom:0}
.cam:hover{background:#333}
.cam input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.cam .cn{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam .cm{font-size:12px;color:var(--muted);white-space:nowrap}
.cam.sel{background:rgba(71,114,179,.28)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:7px 12px;border-radius:5px;border:1px solid var(--outline);background:var(--raised);cursor:pointer;color:var(--ink-2);min-width:104px}
.chip small{font-size:11.5px;color:#cfcfcf;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--raised-hi)}
.chip[aria-pressed="true"]{border-color:#2f4d7a;background:var(--blue);color:#fff}
.chip[aria-pressed="true"] small{color:#dbe6f6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.input{height:34px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--outline);background:var(--raised);width:100%}
.input:hover{background:var(--raised-hi)}
select.input{cursor:pointer}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(71,114,179,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.toggle input{accent-color:var(--blue);width:16px;height:16px}
details.adv>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:flex-start;gap:8px;color:var(--ink-2)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.adv[open]>summary::before{transform:rotate(90deg)}
details.adv .inner{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.sum{position:sticky;top:72px}
.sum .pb{display:flex;flex-direction:column;gap:14px}
.sum .big{font-size:22px;font-weight:600;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--ink-2);background:#232323;border:1px solid var(--outline);border-radius:var(--r-sm);padding:10px 12px}

/* ---------- detail ---------- */
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--ink)}
.dhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.dhead .l{display:flex;flex-direction:column;gap:8px;min-width:0}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;margin-top:20px;align-items:start}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.res .shot{aspect-ratio:16/9}
.res .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px}
.res .cap .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .cap .sz{color:var(--muted);font-size:12px;white-space:nowrap}
.res.pending .shot{border-bottom:1px solid var(--line)}
.path{font-family:var(--mono);font-size:12px;background:var(--field);border:1px solid var(--outline);padding:9px 10px;border-radius:var(--r-sm);word-break:break-all;color:var(--ink-2)}
.logbox{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--field);border-radius:var(--r-sm);padding:10px 12px;line-height:1.6;max-height:260px;overflow:auto;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#333;border:1px solid var(--line-2);color:var(--ink);padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;transition:all .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- history ---------- */
.filters{display:flex;gap:10px;margin:16px 0;align-items:center;flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width:1080px){.home,.cfg,.dgrid{grid-template-columns:1fr}.sum{position:static}}
@media (max-width:760px){
  .top{gap:8px;padding:0 10px}.status .txt,.me .nm,.brand b,.top .lbl,.me .av{display:none}.tabs a{padding:0 9px}.top .btn.primary{width:34px;padding:0;font-size:18px}
  main{padding:16px 12px 40px}.now{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}.hide-sm{display:none}.seg button{min-width:0}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="mark">T</span><b>TALA RENDER</b></a>
  <nav class="tabs" aria-label="Menu">
    <a href="#/" data-tab="home">Queue</a>
    <a href="#/history" data-tab="history">History</a>
  </nav>
  <div class="grow"></div>
  <div class="status" id="status"><i class="led" id="led"></i><span class="txt" id="statusTxt">Connecting…</span></div>
  <a class="btn primary" href="#/new" aria-label="New render">+<span class="lbl"> New render</span></a>
  <div class="me"><span class="av" id="av"></span><span class="nm" id="meName"></span><a class="btn ghost sm" href="/logout">Log out</a></div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/*__BOOT__*/
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
$('#av').textContent = (TR.user||'?')[0]; $('#meName').textContent = TR.user + (TR.role==='admin'?' · admin':'');

/* ---------------- format ---------------- */
function fmtBytes(b){ if(b==null) return '—'; const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024&&i<4){b/=1024;i++} return (b>=100||i===0?b.toFixed(0):b.toFixed(1))+' '+u[i]; }
function fmtDur(s){ if(s==null) return '—'; s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  if(h) return h+'h '+m+'m'; if(m) return m+'m '+String(x).padStart(2,'0')+'s'; return x+'s'; }
function fmtClock(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+fmtClock(iso); }
function between(a,b){ if(!a||!b) return null; return (new Date(b)-new Date(a))/1000; }
const STATUS = {queued:['Queued','b-q'],running:['Rendering','b-run'],canceling:['Cancelling…','b-run'],done:['Done','b-ok'],failed:['Failed','b-bad'],canceled:['Cancelled','b-mute']};
const badge = s => `<span class="badge ${STATUS[s]?.[1]||'b-q'}">${STATUS[s]?.[0]||esc(s)}</span>`;
function content(j){ const n=j.cameras.length;
  if(j.mode==='anim'){ const f=j.frame_end-j.frame_start+1; return `Animation · ${f} frame${f>1?'s':''}${n>1?' × '+n+' cameras':''}`; }
  return `Image · ${n} camera${n>1?'s':''}`; }

function etaLine(j){
  const e=j.eta||{}, p=j.progress;
  const unit = j.mode==='anim' ? 'frame' : 'image';
  if(p.phase==='membuka file') return `Opening file &amp; preparing scene…`;
  if(p.phase==='membuat video') return `All frames done · encoding MP4 video…`;
  if(e.measured) return `Done around <b>${e.finish}</b> · <b>${fmtDur(e.remaining)}</b> left <span class="sub">(measured: avg ${fmtDur(e.avg_unit)} per ${unit})</span>`;
  if(!p.sample) return `<span class="sub">Blender is loading the scene (geometry, textures, BVH) before the first sample. Heavy scenes can take a few minutes — the bar moves once sampling starts.</span>`;
  if(e.cur_remaining!=null) return `This ${unit} done in ~<b>${fmtDur(e.cur_remaining)}</b> <span class="sub">· total estimate appears after the first ${unit} finishes</span>`;
  return `<span class="sub">Estimate appears after the first ${unit} finishes</span>`;
}
function curLine(j){
  const p=j.progress; const parts=[];
  if(j.cameras.length>1 && p.cam) parts.push(`Camera <b>${(p.cam_i||0)+1}/${j.cameras.length}</b> · ${esc(p.cam)}`);
  else if(p.cam) parts.push(esc(p.cam));
  if(j.mode==='anim' && p.frame!=null) parts.push(`Frame <b>${p.frame}</b>`);
  if(p.sample_total && p.sample) parts.push(`Sample <b>${p.sample}</b>/${p.sample_total}`);
  else if(j.status==='running' && p.phase==='render') parts.push(`<span class="sub">Preparing scene${p.status_text?': '+esc(p.status_text):''}${p.unit_elapsed!=null?' · '+fmtDur(p.unit_elapsed):''}</span>`);

}

    ${d?`<div><div class="srow"><span class="k">Storage</span><span class="v">${fmtBytes(d.free)} free</span></div><div class="bar thin" style="margin-top:6px"><i style="width:${(100*(1-d.free/d.total)).toFixed(1)}%"></i></div></div>`:''}

  const rec = S.recent.length ? `<section class="panel recent"><div class="ph"><span>Recently finished</span></div>
    ${S.recent.map(j=>{ const t=(j.results||[]).find(r=>r.thumb);
      return `<a href="#/job/${j.id}"><div class="th">${t?`<img src="/thumbs/${j.id}/${encodeURIComponent(t.thumb)}" alt="">`:''}</div>
      <div style="min-width:0"><div class="jn" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.title)}</div><div class="js">${esc(j.user)} · ${fmtClock(j.finished)}</div></div>${badge(j.status)}</a>`}).join('')}</section>` : '';
  app.innerHTML = `<h1>Render queue</h1><div class="home"><div class="col">${nowHtml}${qHtml}</div><aside class="col">${srv}${rec}</aside></div>`;

let NF=null;   // state form render baru
function steps(n){ const L=['Upload file','Set up render','Queued'];

      <div class="guide">
        <div><b>Option A · One .blend file</b> <span class="badge b-ok" style="height:20px">easiest</span>
          <ol><li>In Blender: <b>File → External Data → Pack Resources</b> (textures, HDRI, fonts)</li>

      </div>
      <div class="fine" style="padding:0 14px 14px">Not supported: simulation caches, Alembic/USD caches and VDB volumes outside the upload. After upload the server checks every file and tells you exactly what is missing.</div>

  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));

function upHtml(file){
  return `<h1>New render</h1>${steps(1)}<section class="panel"><div class="up">
    <div class="row"><span class="fname">${esc(file.name)}</span><span class="pct" id="upPct">0%</span></div>
    <div class="bar"><i id="upBar" style="width:0%"></i></div>
    <div class="facts"><span><b id="upDone">0 B</b> of ${fmtBytes(file.size)}</span><span>Speed <b id="upSpeed">—</b></span><span>Time left <b id="upLeft">calculating…</b></span></div>
    <div class="phase" id="phase">
      <div class="curP" id="ph1"><span class="ic">●</span>Sending file to the server</div>
      <div id="ph2"><span class="ic">○</span>Reading the file (cameras, resolution, frames, textures)</div>
    </div>
    <div style="margin-top:20px;display:flex;gap:8px"><button class="btn ghost danger" id="upCancel">Cancel</button></div>
  </div></section>`;
}
function startUpload(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['blend','zip'].includes(ext)){ toast('Only .blend or .zip files'); return; }
  if(file.size>5*1024**3){ toast('Maximum file size is 5 GB'); return; }
  app.innerHTML=upHtml(file);
  const xhr=new XMLHttpRequest(); let t0=performance.now(), samples=[];
  xhr.open('PUT','/api/upload'); xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));
  xhr.upload.onprogress=e=>{ if(!e.lengthComputable) return;
    const now=performance.now(); samples.push([now,e.loaded]); samples=samples.filter(s=>now-s[0]<4000);
    const pct=100*e.loaded/e.total, dt=(now-samples[0][0])/1000, db=e.loaded-samples[0][1];
    const speed = dt>0.3 ? db/dt : null;
    $('#upPct').textContent=pct.toFixed(0)+'%'; $('#upBar').style.width=pct+'%'; $('#upDone').textContent=fmtBytes(e.loaded);
    if(speed){ $('#upSpeed').textContent=fmtBytes(speed)+'/s'; $('#upLeft').textContent=fmtDur((e.total-e.loaded)/speed); }
    if(e.loaded===e.total){ $('#upLeft').textContent='waiting for server…'; }
  };
  xhr.onload=()=>{ let d={}; try{d=JSON.parse(xhr.responseText)}catch{}
    if(xhr.status!==200){ uploadFail(d.error||'Upload failed ('+xhr.status+')'); return; }
    $('#upLeft').textContent='done'; $('#upSpeed').textContent=fmtBytes(file.size/((performance.now()-t0)/1000))+'/s average';
    analyse(d); };
  xhr.onerror=()=>uploadFail('Connection to the server was lost during upload.');
  xhr.onabort=()=>viewNew();
  $('#upCancel').onclick=()=>xhr.abort();
  xhr.send(file);
}
function uploadFail(msg){ const ph=$('#phase'); if(ph) ph.insertAdjacentHTML('afterend',`<div class="errbox" style="margin-top:16px">${esc(msg)}</div>`);
  const b=$('#upCancel'); if(b){ b.textContent='Choose another file'; b.className='btn'; b.onclick=viewNew; } }
async function analyse(up){
  $('#ph1').className='doneP'; $('#ph1 .ic').textContent='✓';
  $('#ph2').className='curP'; $('#ph2 .ic').textContent='●';
  $('#ph2').insertAdjacentHTML('beforeend',` <span class="sub tnum" id="anT">0s</span>`);
  $('#upBar').parentElement.className='bar indet'; $('#upBar').style.width='';
  $('#upPct').textContent='';
  const t0=Date.now(); const tick=setInterval(()=>{ const el=$('#anT'); if(el) el.textContent=fmtDur((Date.now()-t0)/1000); },500);
  $('#upCancel').onclick=async()=>{ clearInterval(tick); await fetch(`/api/uploads/${up.id}/discard`,{method:'POST'}); viewNew(); };
  try{ const info=await api('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:up.id})});
    clearInterval(tick); viewConfig(info);
  }catch(err){ clearInterval(tick); $('#upBar').parentElement.className='bar'; uploadFail(err.message); }
}
const RES=[['file','From file'],['fhd','Full HD',1920],['2k','2K',2560],['4k','4K',3840],['8k','8K',7680]];
function dims(info,key){ let w=info.out_x,h=info.out_y; const t=(RES.find(r=>r[0]===key)||[])[2];
  if(t){ const k=t/Math.max(w,h); w=w*k; h=h*k; } return [Math.max(4,Math.round(w/2)*2),Math.max(4,Math.round(h/2)*2)]; }
function viewConfig(info){

  const all=f.querySelector('[data-camall]'); if(all) all.onclick=()=>{NF.cams=new Set(info.cameras.filter(c=>!c.hide_render).map(c=>c.name));drawForm();drawSum()};
  const ac=f.querySelector('[data-camactive]'); if(ac) ac.onclick=()=>{NF.cams=new Set(info.cameras.filter(c=>c.active).map(c=>c.name));drawForm();drawSum()};
  const ack=$('#ackMissing'); if(ack) ack.onchange=()=>{NF.ackMissing=ack.checked;drawSum()};
  const fs=$('#fs'),fe=$('#fe'),vid=$('#vid');
  if(fs){ fs.oninput=()=>{NF.fs=+fs.value;drawSum()}; fe.oninput=()=>{NF.fe=+fe.value;drawSum()}; vid.onchange=()=>{NF.video=vid.checked;drawSum()}; }
  $('#smp').onchange=e=>{NF.samples=e.target.value;$('#smpCustomF').hidden=NF.samples!=='custom';drawSum()};
  $('#smpC').oninput=e=>{NF.sampleCustom=+e.target.value;drawSum()};
  $('#fmt').onchange=e=>{NF.format=e.target.value;drawSum()};
}
function drawSum(){
  const {info}=NF; const n=NF.cams.size; const [w,h]=dims(info,NF.res);
  const frames=Math.max(0,NF.fe-NF.fs+1);
  const samples = NF.samples==='file'?info.samples:NF.samples==='custom'?NF.sampleCustom:+NF.samples;
  const fmt = NF.format!=='file'?(NF.format==='JPEG'?'JPG':'PNG'):(['FFMPEG','AVI_JPEG','AVI_RAW'].includes(info.format)?'PNG':info.format);
  let out, err=null;
  if(NF.mode==='image') out=`${n} image${n!==1?'s':''}`;
  else { out=`${frames*n} frames`; if(frames<1) err='End frame must be ≥ start frame.'; }
  if(!n) err='Select at least one camera.';
  if(!err && (info.missing||[]).length && !NF.ackMissing) err='Some textures/assets are missing — fix the file, or tick "Render anyway".';
  const ahead=info.queue_ahead;
  const folder=`\\\\${TR.server}\\Render\\Output\\${TR.user}\\${info.upload.name.replace(/\.(blend|zip)$/i,'').replace(/[<>:"/\\|?*]+/g,'_')}_…`;
  $('#sum').innerHTML=`
    <div><div class="big">${out}</div><div class="sub">${NF.mode==='anim'?`${frames} frames × ${n} camera${n>1?'s':''}${NF.video?' · '+n+' MP4 video'+(n>1?'s':''):''}`:(n>1?'one image per camera':'')}</div></div>
    <dl class="kv">
      <dt>Resolution</dt><dd class="tnum">${w}×${h}</dd>
      <dt>Quality</dt><dd>${samples?samples+' samples':'from file'}</dd>
      <dt>Format</dt><dd>${esc(fmt)}</dd>
      <dt>Render</dt><dd>${info.engine==='CYCLES'?'Cycles · GPU RTX 5090':esc(info.engine.replace('BLENDER_',''))}</dd>
      <dt>Queue</dt><dd>${ahead?`#${ahead+1} (${ahead} job${ahead>1?'s':''} ahead)`:'starts right away'}</dd>
    </dl>
    <div class="note">Render time can't be known before it starts. Once the first ${NF.mode==='anim'?'frame':'image'} finishes, the estimate is measured from the real render and shown in the queue.</div>
    ${err?`<div class="errbox">${err}</div>`:''}
    <button class="btn primary lg" id="go" ${err?'disabled':''}>Add to queue</button>
    <div class="fine">Results are saved in your account folder:<div class="path" style="margin-top:6px">${esc(folder)}</div></div>`;
  $('#go').onclick=submitJob;
}
async function submitJob(){
  const b=$('#go'); b.disabled=true; b.textContent='Submitting…';
  const {info}=NF;
  const body={upload_id:info.upload.id, mode:NF.mode, cameras:[...NF.cams], res:NF.res, format:NF.format,
    samples: NF.samples==='file'?null:NF.samples==='custom'?NF.sampleCustom:+NF.samples,
    frame_start:NF.fs, frame_end:NF.fe, video:NF.video};
  try{ const r=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('Added to queue'); location.hash='#/job/'+r.id;
  }catch(err){ b.disabled=false; b.textContent='Add to queue'; toast(err.message); }
}

/* ================= DETAIL JOB ================= */
async function viewJob(id){
  const draw=async()=>{
    let j; try{ j=await api('/api/jobs/'+id); }catch(e){ app.innerHTML=`<div class="errbox">${esc(e.message)}</div>`; clearInterval(timer); return; }
    const running=['running','canceling'].includes(j.status);
    const unit=j.mode==='anim'?'frame':'image';
    const dur=j.finished?between(j.started,j.finished):null;
    const isMac=/Mac/.test(navigator.platform);
    const res=j.results||[];
    const resCards=res.map(r=>{
      if(r.kind==='image'){ const url=`/files/${j.id}/${encodeURIComponent(r.file)}`;
        return `<figure class="panel res" style="margin:0"><a class="shot" href="${url}" target="_blank" rel="noopener" title="Open full size">${r.thumb?`<img src="/thumbs/${j.id}/${encodeURIComponent(r.thumb)}" alt="${esc(r.cam)}" loading="lazy">`:`<div class="ph-txt">Creating preview…</div>`}</a>
          <figcaption class="cap"><span style="min-width:0"><div class="fn">${esc(r.file)}</div><div class="sz tnum">${fmtBytes(r.size)}</div></span><a class="btn sm" href="${url}?dl=1">Download</a></figcaption></figure>`; }
      const vurl=r.video?`/files/${j.id}/${encodeURIComponent(r.video)}`:null;
      return `<figure class="panel res" style="margin:0"><div class="shot">${vurl?`<video src="${vurl}" controls preload="metadata" ${r.thumb?`poster="/thumbs/${j.id}/${encodeURIComponent(r.thumb)}"`:''} style="width:100%;height:100%"></video>`:(r.thumb?`<img src="/thumbs/${j.id}/${encodeURIComponent(r.thumb)}" alt="">`:'')}</div>
        <figcaption class="cap"><span style="min-width:0"><div class="fn">${esc(r.cam)}</div><div class="sz tnum">${r.frames} frames · ${fmtBytes(r.size)}${r.video?' · video '+fmtBytes(r.video_size):''}</div></span>${vurl?`<a class="btn sm" href="${vurl}?dl=1">Download MP4</a>`:''}</figcaption></figure>`;
    }).join('');
    const pending = running ? j.cameras.slice(j.mode==='image'?res.length:0).filter(()=>j.mode==='image').map((c,i)=>
      `<figure class="panel res pending" style="margin:0"><div class="shot"><div class="ph-txt">${i===0&&j.progress.cam===c?'Rendering…':'Waiting'}</div></div><figcaption class="cap"><span style="min-width:0"><div class="fn" style="color:var(--ink-2)">${esc(c)}</div><div class="sz">${i===0&&j.progress.cam===c?'sample '+j.progress.sample+'/'+(j.progress.sample_total||'…'):'not started'}</div></span></figcaption></figure>`).join('') : '';
    const prog = running||j.status==='queued' ? `<section class="panel" style="margin-top:20px"><div class="pb">
        ${j.status==='queued'?`<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b>Waiting for its turn</b><span class="sub">#${j.queue_pos||'?'} in queue</span></div><div class="fine" style="margin-top:6px">Rendering starts automatically when the jobs ahead finish.</div>`:
        `<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big-pct tnum">${(j.eta?.pct??0).toFixed(0)}%</span><span class="fine tnum">${j.progress.unit_done}/${j.progress.unit_total} ${unit}s done</span></div>
        <div class="bar" style="margin-top:6px"><i style="width:${j.eta?.pct??0}%"></i></div>
        <div class="prow"><span>${curLine(j)}</span></div><div class="bar thin orange" style="margin-top:6px"><i style="width:${((j.eta?.cur_frac||0)*100).toFixed(1)}%"></i></div>
        <div class="eta" style="margin-top:12px">${etaLine(j)}</div>`}</div></section>` : '';
    app.innerHTML=`
      <div class="crumb"><a href="#/">Queue</a> / ${esc(j.title)}</div>
      <div class="dhead"><div class="l"><h1>${esc(j.title)}</h1>
        <div class="meta">${badge(j.status)}<span>by ${esc(j.user)}</span><span>${content(j)}</span><span class="tnum">${resTxt(j)}</span>
        ${dur!=null&&j.status==='done'?`<span class="tnum">${fmtClock(j.started)}–${fmtClock(j.finished)} · ${fmtDur(dur)}</span>`:`<span>submitted ${fmtDate(j.created)}</span>`}</div></div>
        <div class="acts" style="margin:0">${j.can_cancel?`<button class="btn ghost danger" data-cancel="${j.id}">Cancel</button>`:''}
          ${res.length?`<a class="btn primary" href="/files/${j.id}/_semua.zip">Download all (.zip · ${fmtBytes(j.out_size)})</a>`:''}</div></div>
      ${j.status==='failed'?`<div class="errbox" style="margin-top:16px"><b>Render failed.</b> ${esc(j.error||'')}</div>`:''}
      ${j.note?`<div class="note" style="margin-top:16px">${esc(j.note)}</div>`:''}
      ${(j.missing||[]).length?`<div class="warnbox" style="margin-top:16px"><b>Rendered with ${j.missing.length} missing file${j.missing.length>1?'s':''}:</b> <span class="mono">${j.missing.slice(0,8).map(esc).join(', ')}${j.missing.length>8?' …':''}</span></div>`:''}
      ${prog}
      <div class="dgrid"><div>${res.length||pending?`<div class="results">${resCards}${pending}</div>`:(j.status==='queued'?'':`<div class="panel empty"><span class="sub">No results yet.</span></div>`)}</div>
        <aside class="col">
          <section class="panel"><div class="ph"><span>Output folder</span></div><div class="pb" style="display:flex;flex-direction:column;gap:10px">
            <div class="path" id="unc">${esc(j.unc)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="copy">Copy path</button>${isMac?`<a class="btn sm" href="${esc(j.smb)}">Open in Finder</a>`:''}</div>
            <div class="fine">${isMac?'Mac: click "Open in Finder" and choose Guest.':'Windows: copy, press <b>Win + R</b>, paste (<b>Ctrl + V</b>), then Enter.'}</div></div></section>
          <section class="panel"><div class="ph"><span>Settings used</span></div><div class="pb"><dl class="kv">
            <dt>File</dt><dd>${esc(j.src_name)}</dd>
            <dt>Cameras</dt><dd>${j.cameras.map(esc).join(', ')}</dd>
            ${j.mode==='anim'?`<dt>Frame</dt><dd class="tnum">${j.frame_start}–${j.frame_end}</dd>`:''}
            <dt>Resolution</dt><dd class="tnum">${resTxt(j)}</dd>
            <dt>Samples</dt><dd>${j.samples_eff||'from file'}</dd>
            <dt>Engine</dt><dd>${j.engine==='CYCLES'?'Cycles · GPU':esc(j.engine||'')}</dd></dl></div></section>
          ${(j.log||[]).length?`<details class="panel adv"><summary class="ph" style="border-bottom:0">Render log</summary><div class="pb"><div class="logbox">${(j.log||[]).map(esc).join('\n')}</div></div></details>`:''}
        </aside></div>`;
    $('#copy').onclick=()=>copyText(j.unc);
    if(!running&&j.status!=='queued') { clearInterval(timer); timer=null; }
  };
  await draw(); if(route.name==='job'&&route.id===id&&!timer) timer=setInterval(()=>{ if(!document.hidden) draw(); },1500);
}
function copyText(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand('copy')}catch{} ta.remove(); toast(ok?'Path copied':'Copy manually: '+t); }

/* ================= RIWAYAT ================= */
let histScope='mine';
async function viewHistory(){
  app.innerHTML=`<h1>History</h1><div class="filters"><div class="seg" role="group" aria-label="Filter">
     <button data-sc="mine" aria-pressed="${histScope==='mine'}" style="min-width:0">Mine</button>
     <button data-sc="all" aria-pressed="${histScope==='all'}" style="min-width:0">Everyone</button></div></div><div id="hist" class="panel"><div class="pb sub">Loading…</div></div>`;
  app.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{histScope=b.dataset.sc;viewHistory()});
  const {jobs}=await api('/api/jobs?scope='+histScope);
  $('#hist').innerHTML = jobs.length ? `<table><thead><tr><th>Job</th><th class="hide-sm">Content</th><th class="hide-sm">Output</th><th>Status</th><th class="r hide-sm">Duration</th></tr></thead><tbody>
    ${jobs.map(j=>`<tr class="link" data-href="#/job/${j.id}"><td><div class="jn">${esc(j.title)}</div><div class="js">${esc(j.user)} · ${fmtDate(j.created)}</div></td>
      <td class="hide-sm">${content(j)}</td><td class="hide-sm tnum">${j.n_results?fmtBytes(j.out_size):'—'}</td><td>${badge(j.status)}</td>
      <td class="r tnum hide-sm sub">${j.status==='done'?fmtDur(between(j.started,j.finished)):j.status==='failed'?esc((j.error||'').slice(0,40)):'—'}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty"><b>No renders yet</b><div class="sub">Renders you submit will appear here.</div></div>`;
}

go();
</script>
